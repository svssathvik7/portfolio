name: CI + Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to clean up (e.g. 2 for pr-2)'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clean install (fix Rollup optional deps on Linux)
        run: rm -rf node_modules frontend/node_modules

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        working-directory: frontend

  cleanup-preview:
    name: Cleanup PR preview deployment
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Delete PR preview deployment from Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "Cleanup skipped: missing Cloudflare secrets."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
          fi
          BRANCH="pr-${PR_NUM}"
          API_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments"

          echo "Cleaning up deployments for branch: $BRANCH"

          DEPLOYMENTS=$(curl -s -X GET "$API_URL" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          echo "$DEPLOYMENTS" | jq -r --arg branch "$BRANCH" '
            .result[] |
            select(
              (.deployment_trigger.metadata.branch == $branch) or
              (if .aliases then (.aliases | any(contains($branch))) else false end)
            ) |
            .id
          ' 2>/dev/null | while read -r DEPLOYMENT_ID; do
            if [ -n "$DEPLOYMENT_ID" ]; then
              echo "Deleting deployment $DEPLOYMENT_ID"
              curl -s -X DELETE "${API_URL}/${DEPLOYMENT_ID}?force=true" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -w "%{http_code}" -o /dev/null
              echo ""
            fi
          done

          echo "Cleanup complete for pr-${PR_NUM}"

  deploy-preview:
    name: PR Preview deployment
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clean install (fix Rollup optional deps on Linux)
        run: rm -rf node_modules frontend/node_modules

      - name: Install frontend deps
        run: bun install
        working-directory: frontend

      - name: Build frontend
        run: bun run build
        working-directory: frontend

      - name: Deploy frontend preview to Cloudflare Pages
        id: frontend
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "preview_url=" >> "$GITHUB_OUTPUT"
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bunx wrangler pages deploy frontend/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "pr-${{ github.event.pull_request.number }}" \
            --commit-dirty=true | tee preview.log

          PREVIEW_URL=$(grep -Eo 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' preview.log | tail -n1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(grep -Eo 'https://[a-z0-9-]+\.pages\.dev' preview.log | tail -n1)
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "missing=false" >> "$GITHUB_OUTPUT"

      - name: Comment preview status on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ toJson(steps.frontend.outputs.preview_url) }}`.replace(/"/g, "");
            const missing = `${{ toJson(steps.frontend.outputs.missing) }}`.replace(/"/g, "") === "true";

            const body = missing
              ? [
                  "⚠️ **Preview deployment not configured yet**",
                  "Set these repo secrets to enable PR preview links:",
                  "- `CLOUDFLARE_API_TOKEN`",
                  "- `CLOUDFLARE_ACCOUNT_ID`",
                  "- `CLOUDFLARE_PAGES_PROJECT`",
                ].join("\n")
              : [
                  "✅ **PR preview is ready**",
                  `- Frontend: ${url}`,
                ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  deploy-production:
    name: Production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clean install (fix Rollup optional deps on Linux)
        run: rm -rf node_modules frontend/node_modules

      - name: Install frontend deps
        run: bun install
        working-directory: frontend

      - name: Build frontend
        run: bun run build
        working-directory: frontend

      - name: Deploy frontend to Cloudflare Pages (production)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "Production deploy skipped: missing Cloudflare secrets."
            exit 0
          fi

          bunx wrangler pages deploy frontend/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "main" \
            --commit-dirty=true
